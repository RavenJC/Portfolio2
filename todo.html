<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Title -->
            <div class="calculator-header">
                <h1>To-Do List ✓</h1>
                <p>Organize your tasks and boost your productivity.</p>
            </div>

            <!-- Todo Container -->
            <div class="todo-container">
                <!-- Add Task Form -->
                <div class="todo-input-section">
                    <form id="todo-form" onsubmit="addTodo(event)">
                        <div class="todo-input-group">
                            <input type="text" id="todo-input" placeholder="What needs to be done?" required>
                            <button type="submit" class="btn btn-primary">Add Task</button>
                        </div>
                    </form>
                </div>

                <!-- Filter Tabs -->
                <div class="todo-filters">
                    <button class="filter-tab active" onclick="filterTodos('all')" data-filter="all">All</button>
                    <button class="filter-tab" onclick="filterTodos('active')" data-filter="active">Active</button>
                    <button class="filter-tab" onclick="filterTodos('archived')" data-filter="archived">Archived</button>
                </div>

                <!-- Tasks List -->
                <div class="todo-list" id="todo-list">
                    <p style="color: var(--text-muted); text-align: center; padding: 2rem;">No tasks yet. Add one above!</p>
                </div>

                <!-- Todo Stats -->
                <div class="todo-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="total-tasks">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="active-tasks">0</span>
                        <span class="stat-label">Active</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="archived-tasks">0</span>
                        <span class="stat-label">Archived</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
