<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Title -->
            <div class="calculator-header">
                <h1>Spin the Wheel 🎡</h1>
                <p>Test your luck! Spin the wheel and see what you win!</p>
            </div>

            <!-- Wheel Container -->
            <div class="wheel-container">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer">▼</div>
                    <canvas id="wheel-canvas" width="400" height="400"></canvas>
                    <button onclick="spinWheel()" class="btn btn-primary spin-button" id="spin-button">
                        SPIN THE WHEEL
                    </button>
                </div>

                <div class="wheel-result" id="wheel-result" style="display: none;">
                    <h3>🎉 You Won!</h3>
                    <div class="result-prize" id="result-prize"></div>
                </div>

                <div class="wheel-history">
                    <h4>Recent Spins:</h4>
                    <div id="spin-history" class="spin-history-list">
                        <p style="color: var(--text-muted);">No spins yet</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
