<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Gallery Title -->
            <div class="calculator-header">
                <h1>Interactive Photo Gallery 📸</h1>
                <p>Browse through a beautiful collection of photos with lightbox view.</p>
            </div>

            <!-- Filter Buttons -->
            <div class="gallery-filters">
                <button onclick="switchGalleryView('all')" class="filter-btn active" data-filter="all">All</button>
                <button onclick="switchGalleryView('nature')" class="filter-btn" data-filter="nature">Nature</button>
                <button onclick="switchGalleryView('tech')" class="filter-btn" data-filter="tech">Technology</button>
                <button onclick="switchGalleryView('abstract')" class="filter-btn" data-filter="abstract">Abstract</button>
                <button onclick="switchGalleryView('archived')" class="filter-btn" data-filter="archived">📁 Archived</button>
            </div>

            <!-- Active Gallery Section -->
            <div id="active-section">
                <div class="photo-gallery" id="photo-gallery">
                    <!-- Photos will be dynamically generated with action buttons -->
                </div>
            </div>

            <!-- Archived Photos Section -->
            <div id="archived-section" style="display: none;">
                <div class="photo-gallery" id="archived-gallery">
                    <!-- Archived photos will appear here -->
                </div>
            </div>

            <!-- Lightbox Modal -->
            <div id="lightbox" class="lightbox" style="display: none;">
                <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
                <span class="lightbox-prev" onclick="navigateLightbox(-1)">&#10094;</span>
                <span class="lightbox-next" onclick="navigateLightbox(1)">&#10095;</span>
                <div class="lightbox-content">
                    <img id="lightbox-img" src="" alt="">
                    <div class="lightbox-caption" id="lightbox-caption"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
