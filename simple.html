    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->

        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Calculator Title -->
            <div class="calculator-header">
                <h1>Simple Calculator</h1>
                <p>Calculate multiplication and division of two numbers with error handling.</p>
            </div>

            <!-- Calculator Container -->
            <div class="calculator-container">
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="simple-num1">First Number:</label>
                        <input type="number" id="simple-num1" placeholder="Enter first number">
                    </div>
                    
                    <div class="form-group">
                        <label for="simple-num2">Second Number:</label>
                        <input type="number" id="simple-num2" placeholder="Enter second number">
                    </div>
                    
                    <div class="calculator-buttons">
                        <button onclick="multiplySimple()" class="btn btn-primary">× M998
                            ultiply</button>
                        <button onclick="divideSimple()" class="btn btn-primary">÷ Divide</button>
                    </div>
                    
                    <div id="result" class="calculator-result">
                        <h3>Result:</h3>
                        <div id="simple-result" class="result-output">0</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
