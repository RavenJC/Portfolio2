<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Calculator Title -->
            <div class="calculator-header">
                <h1>Currency Converter</h1>
                <p>Convert between major world currencies with real-time exchange rates.</p>
            </div>

            <!-- Calculator Container -->
            <div class="calculator-container">
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="currency-amount">Amount:</label>
                        <input type="number" id="currency-amount" placeholder="Enter amount" step="0.01" value="1">
                    </div>
                    
                    <div class="currency-selector-group">
                        <div class="form-group">
                            <label for="currency-from">From:</label>
                            <select id="currency-from" class="currency-select">
                                <option value="USD">USD - US Dollar</option>
                                <option value="EUR">EUR - Euro</option>
                                <option value="GBP">GBP - British Pound</option>
                                <option value="JPY">JPY - Japanese Yen</option>
                                <option value="PHP" selected>PHP - Philippine Peso</option>
                                <option value="AUD">AUD - Australian Dollar</option>
                                <option value="CAD">CAD - Canadian Dollar</option>
                                <option value="CNY">CNY - Chinese Yuan</option>
                                <option value="INR">INR - Indian Rupee</option>
                            </select>
                        </div>

                        <div class="currency-swap">
                            <button onclick="swapCurrencies()" class="btn-swap" title="Swap currencies">⇄</button>
                        </div>

                        <div class="form-group">
                            <label for="currency-to">To:</label>
                            <select id="currency-to" class="currency-select">
                                <option value="USD" selected>USD - US Dollar</option>
                                <option value="EUR">EUR - Euro</option>
                                <option value="GBP">GBP - British Pound</option>
                                <option value="JPY">JPY - Japanese Yen</option>
                                <option value="PHP">PHP - Philippine Peso</option>
                                <option value="AUD">AUD - Australian Dollar</option>
                                <option value="CAD">CAD - Canadian Dollar</option>
                                <option value="CNY">CNY - Chinese Yuan</option>
                                <option value="INR">INR - Indian Rupee</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="calculator-buttons">
                        <button onclick="convertCurrency()" class="btn btn-primary">Convert</button>
                    </div>
                    
                    <div id="currency-result" class="calculator-result">
                        <h3>Result:</h3>
                        <div id="currency-output" class="result-output">0.00</div>
                        <div id="currency-rate" class="currency-rate"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
