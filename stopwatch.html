<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Title -->
            <div class="calculator-header">
                <h1>Stopwatch ⏱️</h1>
                <p>Precise time tracking with lap functionality.</p>
            </div>

            <!-- Stopwatch Container -->
            <div class="stopwatch-container">
                <div class="stopwatch-display">
                    <div class="time-display" id="stopwatch-display">00:00:00.000</div>
                </div>

                <div class="stopwatch-controls">
                    <button onclick="startStopwatch()" class="btn btn-primary" id="start-btn">Start</button>
                    <button onclick="lapStopwatch()" class="btn btn-outline" id="lap-btn" disabled>Lap</button>
                    <button onclick="resetStopwatch()" class="btn btn-outline" id="reset-btn">Reset</button>
                </div>

                <div class="laps-container" id="laps-container" style="display: none;">
                    <h3>Lap Times:</h3>
                    <div class="laps-list" id="laps-list"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
