<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Calculator Title -->
            <div class="calculator-header">
                <h1>Basic Calculator</h1>
                <p>Perform all four basic arithmetic operations: addition, subtraction, multiplication, and division.</p>
            </div>

            <!-- Calculator Container -->
            <div class="calculator-container">
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="num1">First Number:</label>
                        <input type="number" id="num1" placeholder="Enter first number">
                    </div>
                    
                    <div class="form-group">
                        <label for="num2">Second Number:</label>
                        <input type="number" id="num2" placeholder="Enter second number">
                    </div>
                    
                    <div class="calculator-buttons">
                        <button onclick="add()" class="btn btn-primary">+ Add</button>
                        <button onclick="subtract()" class="btn btn-primary">- Subtract</button>
                        <button onclick="multiply()" class="btn btn-primary">× Multiply</button>
                        <button onclick="divide()" class="btn btn-primary">÷ Divide</button>
                    </div>
                    
                    <div id="result" class="calculator-result">
                        <h3>Result:</h3>
                        <div id="output" class="result-output">0</div>
                        <div id="operation" class="operation-display"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
