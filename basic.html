<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator - Raven John Climaco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <div class="profile-pic">R</div>
                <span>Raven John Climaco</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Back Button -->
            <a href="projects.html" class="back-button">Back to Projects</a>

            <!-- Calculator Title -->
            <div class="calculator-header">
                <h1>Basic Calculator</h1>
                <p>Perform all four basic arithmetic operations with a professional calculator interface.</p>
            </div>

            <!-- Calculator Container -->
            <div class="calculator-wrapper">
                <div class="modern-calculator">
                    <!-- Display -->
                    <div class="calculator-display-modern">
                        <div class="calc-expression" id="calc-expression"></div>
                        <div class="calc-result-main" id="calc-result-main">0</div>
                    </div>
                    
                    <!-- Calculator Buttons Grid -->
                    <div class="calculator-buttons-grid">
                        <!-- Row 1: AC, Backspace, %, ÷ -->
                        <button class="calc-btn-modern calc-function" onclick="clearCalculator()">AC</button>
                        <button class="calc-btn-modern calc-function" onclick="backspace()">⌫</button>
                        <button class="calc-btn-modern calc-function" onclick="percentage()">%</button>
                        <button class="calc-btn-modern calc-operator" onclick="selectOperator('÷')">÷</button>
                        
                        <!-- Row 2: 7, 8, 9, × -->
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('7')">7</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('8')">8</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('9')">9</button>
                        <button class="calc-btn-modern calc-operator" onclick="selectOperator('×')">×</button>
                        
                        <!-- Row 3: 4, 5, 6, - -->
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('4')">4</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('5')">5</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('6')">6</button>
                        <button class="calc-btn-modern calc-operator" onclick="selectOperator('-')">-</button>
                        
                        <!-- Row 4: 1, 2, 3, + -->
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('1')">1</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('2')">2</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('3')">3</button>
                        <button class="calc-btn-modern calc-operator" onclick="selectOperator('+')">+</button>
                        
                        <!-- Row 5: 00, 0, ., = -->
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('00')">00</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('0')">0</button>
                        <button class="calc-btn-modern calc-number" onclick="inputNumber('.')">.</button>
                        <button class="calc-btn-modern calc-equals" onclick="compute()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Raven John Climaco. All rights reserved.</p>
                <div class="social-links">
                    <a href="mailto:raven@example.com">📧</a>
                    <a href="https://linkedin.com">💼</a>
                    <a href="https://github.com">🔗</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
